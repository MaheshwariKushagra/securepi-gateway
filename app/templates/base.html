<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if title %}{{ title }} · {% endif %}SecurePi Gateway</title>
    <link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body data-page="{{ active }}">

<svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="1.5"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 L22 20 H2 Z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17.2" r="0.9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16 L6 10 C6 6.5 8.5 4 12 4 C15.5 4 18 6.5 18 10 L18 16 L20 19 H4 Z"/><path d="M10 19 a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20 L4 16 L15.5 4.5 a2.1 2.1 0 0 1 3 3 L6.5 20 Z"/><line x1="13" y1="7" x2="17" y2="11"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="15"/><polyline points="7,10 12,15 17,10"/><line x1="4" y1="20" x2="20" y2="20"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 L20 5 L20 12 L12 22 L4 12 L4 5 Z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><polyline points="2,12 8,12 10,5 14,19 16,12 22,12"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6,9 12,15 18,9"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11,6 5,12 11,18"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 4 H21 L14 12.5 V19 L10 21 V12.5 Z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24">
        <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/>
        <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/>
        <line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/>
    </symbol>
</svg>

<div class="shell" id="shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
            <span class="brand-mark"><svg class="icon" width="16" height="16"><use href="#i-shield"/></svg></span>
            <span class="brand-name">SecurePi</span>
            <button class="icon-btn sidebar-collapse" id="sidebarCollapse" title="Collapse sidebar" aria-label="Collapse sidebar">
                <svg class="icon" width="16" height="16"><use href="#i-arrow-left"/></svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="{{ 'active' if active=='dashboard' }}">
                <svg class="icon" width="17" height="17"><use href="#i-grid"/></svg><span>Dashboard</span></a>
            <a href="/devices" class="{{ 'active' if active=='devices' }}">
                <svg class="icon" width="17" height="17"><use href="#i-monitor"/></svg><span>Devices</span></a>
            <a href="/incidents" class="{{ 'active' if active=='incidents' }}">
                <svg class="icon" width="17" height="17"><use href="#i-alert"/></svg><span>Incidents</span>
                <span class="nav-badge" id="navIncidentBadge" hidden>0</span></a>
            <a href="/filtering" class="{{ 'active' if active=='filtering' }}">
                <svg class="icon" width="17" height="17"><use href="#i-filter"/></svg><span>Filtering</span></a>
            <a href="/settings" class="{{ 'active' if active=='settings' }}">
                <svg class="icon" width="17" height="17"><use href="#i-sliders"/></svg><span>Settings</span></a>
        </nav>
        <div class="sidebar-foot">
            <button class="pipeline-status" id="pipelineStatus" title="Pipeline health">
                <span class="pipeline-dot" id="pipelineDot"></span>
                <span class="pipeline-text">
                    <span id="pipelineLabel">Checking…</span>
                    <span class="dim" id="pipelineSub">pipeline</span>
                </span>
            </button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn only-collapsed" id="sidebarExpand" title="Expand sidebar" aria-label="Expand sidebar" hidden>
                <svg class="icon" width="17" height="17"><use href="#i-menu"/></svg>
            </button>
            <h1 class="topbar-title">{{ title or "SecurePi Gateway" }}</h1>
            <div class="spacer"></div>
            <button class="cmdk-trigger" id="cmdkTrigger">
                <svg class="icon" width="14" height="14"><use href="#i-search"/></svg>
                <span>Search devices, incidents…</span>
                <kbd>⌘K</kbd>
            </button>
            <div class="notif-wrap">
                <button class="icon-btn" id="notifBtn" aria-label="Notifications">
                    <svg class="icon" width="18" height="18"><use href="#i-bell"/></svg>
                    <span class="badge" id="notifBadge" hidden>0</span>
                </button>
                <div class="notif-panel" id="notifPanel" hidden>
                    <div class="notif-panel-head">Open incidents</div>
                    <div class="notif-panel-body" id="notifPanelBody"><div class="empty">Loading…</div></div>
                    <a class="notif-panel-foot" href="/incidents">View all incidents →</a>
                </div>
            </div>
            <span class="live" id="liveIndicator">
                <span class="live-dot"></span>
                <span id="liveLabel">Live</span>
                <span class="dim">· <span id="lastUpdated">—</span></span>
            </span>
            <button class="btn" id="liveToggle">Pause</button>
        </header>
        <main>
        {% block content %}{% endblock %}
        </main>
    </div>
</div>

<div class="cmdk-overlay" id="cmdkOverlay" hidden>
    <div class="cmdk-modal">
        <div class="cmdk-input-row">
            <svg class="icon" width="16" height="16"><use href="#i-search"/></svg>
            <input id="cmdkInput" placeholder="Jump to a device, incident, or page…" autocomplete="off">
            <kbd>esc</kbd>
        </div>
        <div class="cmdk-results" id="cmdkResults"></div>
    </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="/static/chart.min.js"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
</body>
</html>
