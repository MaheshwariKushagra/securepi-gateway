{% extends "base.html" %}
{% block content %}
<div class="page-head">
    <div class="page-title">
        <h1>Devices <span class="count-pill" id="deviceCount">—</span></h1>
        <p class="page-sub">Every device the gateway has seen, anchored by MAC or DHCP hostname</p>
    </div>
    <div class="page-actions">
        <input class="input search" id="deviceSearch" placeholder="Search name, IP, hostname…" aria-label="Search devices">
        <button class="btn" id="hideTest">Hide test devices</button>
        <button class="btn icon-label" id="devicesExport" title="Export visible devices as CSV">
            <svg class="icon" width="14" height="14"><use href="#i-download"/></svg> Export
        </button>
    </div>
</div>

<div class="card">
    <div class="table-scroll">
    <table>
        <thead><tr>
            <th class="sortable" data-key="name">Device <span class="arrow"></span></th>
            <th>Address</th>
            <th>Identity</th>
            <th class="sortable num" data-key="down">Down <span class="arrow">▼</span></th>
            <th class="sortable num" data-key="up">Up <span class="arrow"></span></th>
            <th class="sortable num" data-key="dns">DNS <span class="arrow"></span></th>
            <th class="sortable num" data-key="blocked">Blocked <span class="arrow"></span></th>
            <th class="sortable num" data-key="incidents">Incidents <span class="arrow"></span></th>
            <th class="num">Seen</th>
        </tr></thead>
        <tbody id="deviceRows">
            <tr><td colspan="9"><div class="empty">Loading…</div></td></tr>
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
