<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="t d">
  <title id="t">SecurePi Gateway</title>
  <desc id="d">A unified network monitoring, filtering and security platform for a small-enterprise network.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9cf9"/>
      <stop offset="1" stop-color="#7b5cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4f9cf9" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f9cf9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#7b5cf0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7b5cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1d2534" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="380" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="380" fill="#0a0e15"/>
    <rect width="1280" height="380" fill="url(#grid)" opacity="0.55"/>
    <rect width="1280" height="380" fill="url(#glow)"/>
    <rect width="1280" height="380" fill="url(#glow2)"/>

    <!-- brand mark -->
    <rect x="72" y="78" width="84" height="84" rx="22" fill="url(#brand)" filter="url(#soft)" opacity="0.55"/>
    <rect x="72" y="78" width="84" height="84" rx="22" fill="url(#brand)"/>
    <path d="M114 96 L140 105.5 L140 125 L114 150 L88 125 L88 105.5 Z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M103 121 L111 129 L126 113" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
      <text x="184" y="134" font-size="60" font-weight="700" fill="#e6ecf5" letter-spacing="-1.5">SecurePi Gateway</text>
      <text x="186" y="170" font-size="21" fill="#8d99ad">Network monitoring · DNS &amp; HTTPS filtering · Security operations console</text>
    </g>

    <!-- pipeline strip -->
    <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">
      <g transform="translate(72 222)">
        <rect width="150" height="40" rx="9" fill="#111722" stroke="#2e3a50"/>
        <circle cx="20" cy="20" r="5" fill="#2fbf71"/>
        <text x="34" y="25" fill="#e6ecf5">Suricata IDS</text>
      </g>
      <g transform="translate(72 272)">
        <rect width="150" height="40" rx="9" fill="#111722" stroke="#2e3a50"/>
        <circle cx="20" cy="20" r="5" fill="#2fbf71"/>
        <text x="34" y="25" fill="#e6ecf5">AdGuard DNS</text>
      </g>
      <g transform="translate(72 322)">
        <rect width="150" height="40" rx="9" fill="#111722" stroke="#2e3a50"/>
        <circle cx="20" cy="20" r="5" fill="#2fbf71"/>
        <text x="34" y="25" fill="#e6ecf5">HTTPS DPI</text>
      </g>
      <path d="M222 242 C 262 242, 262 292, 300 292 M222 292 H300 M222 342 C 262 342, 262 292, 300 292" fill="none" stroke="#4f9cf9" stroke-width="2" opacity="0.7"/>
      <g transform="translate(300 272)">
        <rect width="118" height="40" rx="9" fill="#161d2b" stroke="#4f9cf9" stroke-opacity="0.6"/>
        <text x="59" y="25" fill="#e6ecf5" text-anchor="middle">ingest</text>
      </g>
      <path d="M418 292 H452" stroke="#4f9cf9" stroke-width="2" opacity="0.7"/>
      <g transform="translate(452 272)">
        <rect width="118" height="40" rx="9" fill="#161d2b" stroke="#4f9cf9" stroke-opacity="0.6"/>
        <text x="59" y="25" fill="#e6ecf5" text-anchor="middle">SQLite</text>
      </g>
      <path d="M570 292 H604" stroke="#4f9cf9" stroke-width="2" opacity="0.7"/>
      <g transform="translate(604 272)">
        <rect width="190" height="40" rx="9" fill="#161d2b" stroke="#7b5cf0" stroke-opacity="0.8"/>
        <text x="95" y="25" fill="#e6ecf5" text-anchor="middle">6-signal engine</text>
      </g>
      <path d="M794 292 H828" stroke="#7b5cf0" stroke-width="2" opacity="0.8"/>
      <g transform="translate(828 272)">
        <rect width="124" height="40" rx="9" fill="rgba(242,84,91,0.12)" stroke="#f2545b" stroke-opacity="0.7"/>
        <text x="62" y="25" fill="#f2545b" text-anchor="middle">incidents</text>
      </g>
    </g>

    <!-- stat cards -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
      <g transform="translate(990 64)">
        <rect width="218" height="92" rx="12" fill="#111722" stroke="#222b3c"/>
        <rect width="3" height="60" x="0" y="16" fill="#4f9cf9"/>
        <text x="22" y="34" font-size="12" fill="#5a6679" letter-spacing="1.4">ALERT → INCIDENT</text>
        <text x="22" y="72" font-size="34" font-weight="700" fill="#e6ecf5">1,588 : 1</text>
      </g>
      <g transform="translate(990 168)">
        <rect width="218" height="92" rx="12" fill="#111722" stroke="#222b3c"/>
        <rect width="3" height="60" x="0" y="16" fill="#2fbf71"/>
        <text x="22" y="34" font-size="12" fill="#5a6679" letter-spacing="1.4">3RD-PARTY AD BLOCK</text>
        <text x="22" y="72" font-size="34" font-weight="700" fill="#e6ecf5">100%</text>
      </g>
      <g transform="translate(990 272)">
        <rect width="218" height="92" rx="12" fill="#111722" stroke="#222b3c"/>
        <rect width="3" height="60" x="0" y="16" fill="#f5a524"/>
        <text x="22" y="34" font-size="12" fill="#5a6679" letter-spacing="1.4">DNS RULES ENFORCED</text>
        <text x="22" y="72" font-size="34" font-weight="700" fill="#e6ecf5">656,735</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="379" rx="18" fill="none" stroke="#222b3c"/>
</svg>
