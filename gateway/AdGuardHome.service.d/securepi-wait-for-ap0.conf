# SecurePi Gateway - start AdGuard Home only after the ap0 access-point
# interface exists. AdGuard's DHCP server looks ap0 up once at startup and,
# if it isn't there yet, logs "finding interface ap0 by name: no such network
# interface" and never retries - DNS keeps working, but no device is given an
# address, so phones pass the Wi-Fi password and then drop off (15 September
# 2026). Install to /etc/systemd/system/AdGuardHome.service.d/.
[Unit]
After=securepi-ap0.service hostapd.service
Wants=securepi-ap0.service
