interface=ap0
driver=nl80211
ssid=SecurePi-Test
country_code=IN
hw_mode=g
channel=6
wmm_enabled=1
ieee80211n=1
ht_capab=[SHORT-GI-20]
auth_algs=1
wpa=2
wpa_passphrase=<REDACTED>
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Client isolation (ENHANCEMENT-PLAN.md step 1.7, finding G8): without
# this, two devices on SecurePi-Test can talk directly to each other
# over the AP itself, invisibly to every sensor this project has -
# the IDS only sees traffic that actually reaches the gateway, and
# client-to-client Wi-Fi frames never do. A phone-to-phone port scan or
# any other peer traffic would be completely undetectable. With
# ap_isolate=1, all client traffic is forced up through the gateway
# (hairpinned back out if the destination is another local client),
# where it becomes visible the same way any other flow is.
#
# Real, accepted trade-off: this also blocks the legitimate local
# peer-to-peer traffic client isolation is generally known for
# breaking - Chromecast/AirPlay casting, local printer discovery, DLNA,
# and mDNS-based discovery (Bonjour/Avahi) between two devices on this
# AP. Acceptable here because SecurePi-Test is a security-evaluation
# network, not a home entertainment one - a production deployment
# wanting both would need a more selective approach (e.g. an mDNS
# reflector) which is out of scope for this project.
ap_isolate=1
