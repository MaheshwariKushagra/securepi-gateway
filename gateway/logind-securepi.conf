# SecurePi Gateway: this machine is a always-on network gateway, not a laptop.
# Closing the lid must not suspend it - doing so drops the access point, NAT,
# DNS and all monitoring for every device on the project LAN.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
