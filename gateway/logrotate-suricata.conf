# SecurePi Gateway - rotation of the IDS (Suricata) logs, 3 October 2026.
#
# Installed as /etc/securepi/logrotate-suricata.conf by
# gateway/install-ids-logrotate.sh, which also moves Ubuntu's packaged
# /etc/logrotate.d/suricata out of the way (dpkg-divert), so the system's
# own logrotate run no longer touches these files. Run every 15 minutes by
# securepi-ids-logrotate.timer, with its own state file.
#
# Why it replaces the packaged rotation (EVALUATION-RESULTS-2.md, 7.7 and
# "Boot faults"): that one is weekly with no size cap and uses copytruncate,
# and Ubuntu's logrotate.timer only runs on AC power. The gateway often ran
# on battery, so eve.json grew to 306 MB over 18 days without rotating, and
# the catch-up rotation then ran in the middle of the 3 October boot.
#
# - daily, or as soon as a file passes 100 MB (checked every 15 minutes);
# - by renaming (eve.json -> eve.json.1) and creating a fresh file, then a
#   HUP so the IDS reopens it. Not copytruncate, which loses whatever the
#   IDS writes between the copy and the truncate. Until the HUP lands the
#   IDS keeps writing to eve.json.1; app/ingest.py's read_eve finishes that
#   file before moving on, which is why the newest rotated file must stay
#   uncompressed and named exactly .1 (delaycompress, no dateext);
# - seven rotated files kept, older ones compressed.
/var/log/suricata/*.log /var/log/suricata/*.json {
    daily
    maxsize 100M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0644 root root
    sharedscripts
    postrotate
        /bin/kill -HUP $(cat /run/suricata.pid) 2>/dev/null || true
    endscript
}
