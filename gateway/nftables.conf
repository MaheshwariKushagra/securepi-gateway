#!/usr/sbin/nft -f
# SecurePi Gateway firewall.
#   ap0    = project LAN (10.10.0.0/24)
#   wlp2s0 = WAN uplink
#   enp1s0 = management link
flush ruleset

table inet filter {
    # Devices cut off from the internet by the platform. Keyed on IP, so a
    # DHCP renewal moves a device out from under it - kept for the
    # `securepi` CLI and anything added by hand, but the console no longer
    # writes here (see quarantine_mac below).
    set quarantine {
        type ipv4_addr
        flags interval
    }

    # ENHANCEMENT-PLAN.md step 4.2: quarantine keyed on MAC, so it survives
    # a DHCP renewal - a device keeps its MAC on this network when its
    # address changes. Written only by app/orchestrator.py (through
    # gateway/securepi-web-helper), which keeps it equal to the console's
    # desired state and re-adds everything after a reboot empties it.
    # `flags timeout` is the safety net for a timed quarantine: each element
    # is given a kernel-side expiry a minute after the policy's own, so a
    # timed quarantine still ends even if the orchestrator isn't running.
    set quarantine_mac {
        type ether_addr
        flags timeout
    }

    # Step 4.2: destinations blocked for every device ("block this IP" from
    # an incident). Also orchestrator-managed, same timeout safety net.
    set blocked_ip {
        type ipv4_addr
        flags timeout
    }

    # Known public DoH resolvers, by IP. Clients reaching these over HTTPS
    # (port 443) bypass our DNS filtering entirely. This list can go stale as
    # providers add addresses, so as of ENHANCEMENT-PLAN.md step 2.2 it's no
    # longer maintained by hand: gateway/refresh-doh-set.sh (run daily by
    # securepi-doh-refresh.timer) replaces this set's contents with HaGeZi's
    # maintained doh-ips.txt list (~1,445 addresses at last count, refreshed
    # upstream roughly every 8 hours). The 14 addresses below are only the
    # SEED - what's live between install and the first successful refresh -
    # not the steady-state list. The port-853 rule below still matters most
    # regardless of how complete this set is: DNS-over-TLS has no legitimate
    # use on port 853 other than talking to a DoH/DoT resolver, so it does
    # not need a "known resolver" list at all - see the dot-bypass rule in
    # the forward chain. This set is also no longer the only detection
    # layer for DoH specifically - correlation.py's dns_bypass_signal also
    # matches Suricata TLS SNI against known DoH provider hostnames, which
    # catches a provider's IP the very day it changes, before any refresh
    # (scheduled or not) would.
    set doh_resolvers {
        type ipv4_addr
        flags interval
        elements = {
            1.1.1.1, 1.0.0.1,
            8.8.8.8, 8.8.4.4,
            9.9.9.9, 149.112.112.112,
            208.67.222.222, 208.67.220.220,
            94.140.14.14, 94.140.15.15,
            45.90.28.0/24, 45.90.30.0/24,
            76.76.2.0/24, 76.76.10.0/24
        }
    }

    chain input  { type filter hook input  priority 0; policy accept; }
    chain output { type filter hook output priority 0; policy accept; }

    chain forward {
        type filter hook forward priority 0; policy drop;
        iifname "ap0" ip saddr @quarantine counter drop comment "quarantined"
        # `ether saddr` is the sending device's own MAC, still on the packet
        # in the forward hook because it arrived on ap0 (a Wi-Fi AP - mac80211
        # hands the kernel ordinary Ethernet frames).
        iifname "ap0" ether saddr @quarantine_mac counter drop comment "quarantined-mac"
        iifname "ap0" ip daddr @blocked_ip counter drop comment "blocked-ip"

        # Port 853 is DNS-over-TLS and nothing else - no legitimate app on a
        # LAN client uses it for anything but talking to a resolver we did
        # not choose. Rejecting all of it, not just to the addresses in
        # doh_resolvers, is what actually closes this bypass: a device
        # pointed at *any* DoT provider (not just the well-known ones above)
        # was getting through before this fix - see ENHANCEMENT-PLAN.md
        # finding A4. The gateway's own outbound DoT to 1.1.1.1 is unaffected
        # - it leaves via the output chain on the WAN interface, never
        # through this ap0 forward path.
        #
        # `log prefix` on each rule (step 2.2) writes one kernel log line per
        # rejected attempt - no `group`, so it goes straight to the kernel
        # ring buffer (dmesg), already captured by journald with no new
        # daemon or nflog socket needed. app/ingest.py's read_nft_log polls
        # `journalctl -k` for these and correlation.py's dns_bypass_signal
        # turns repeated hits from one device into an incident. Deliberately
        # only on these three specific reject rules, not a project-wide
        # `log` policy - see this project's own "everything runs locally,
        # metadata only" stance: this is metadata about attempted bypasses,
        # not a general traffic log.
        iifname "ap0" tcp dport 853 counter log prefix "dot-bypass: " reject comment "dot-bypass"
        iifname "ap0" ip daddr @doh_resolvers tcp dport 443 counter log prefix "doh-bypass: " reject comment "doh-bypass"
        iifname "ap0" udp dport 443 counter log prefix "quic-blocked: " reject comment "quic-blocked"
        iifname "ap0" oifname "wlp2s0" counter accept comment "lan-out"
        iifname "wlp2s0" oifname "ap0" ct state established,related accept
    }
}

table ip nat {
    # Devices opted in to HTTPS inspection. NOTE: this set must live in the
    # same table as the rule that references it - nftables sets are per-table.
    # Empty by default; nothing is inspected until an address is added.
    #
    # `flags timeout` lets an element carry its own auto-expiry (step 5.6c's
    # auto-unenroll) with no scheduler or sweep needed - the kernel removes
    # it itself. app/dpi_enroll.py always deletes an existing element before
    # re-adding it with a fresh timeout: confirmed live that `nft add
    # element` on an element that already exists is a silent no-op even
    # when the new timeout differs, so re-enrolling an already-enrolled
    # device would otherwise NOT reset its clock.
    set enrolled {
        type ipv4_addr
        flags timeout
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;

        # Force plaintext DNS to our resolver whatever the client is set to.
        # Note what this does NOT cover: a client correctly pointed at
        # 10.10.0.1 (what DHCP handed it) never matches "daddr != 10.10.0.1"
        # at all, so if AdGuard itself stops answering there, this rule does
        # nothing for it. ENHANCEMENT-PLAN.md step 3.6's app/dns_failopen.py
        # handles that case by adding (and later removing) two more runtime
        # rules here - "iifname ap0 ip daddr 10.10.0.1 udp/tcp dport 53 ...
        # dnat to 1.1.1.1:53", tagged with comment "dns-failopen" - whenever
        # AdGuard stops answering real queries. Never baked into this static
        # file: it's toggled live by app/health.py, and a `nft -f` reload of
        # this file (which this project never does at runtime - see the
        # quarantine/enrolled sets' own comments) would wipe it anyway.
        iifname "ap0" udp dport 53 ip daddr != 10.10.0.1 counter dnat to 10.10.0.1:53
        iifname "ap0" tcp dport 53 ip daddr != 10.10.0.1 counter dnat to 10.10.0.1:53

        # Send enrolled devices HTTPS to the inspection proxy. The proxy then
        # decides per-connection, from the TLS SNI, whether to decrypt at all.
        iifname "ap0" ip saddr @enrolled tcp dport 443 counter redirect to :8080 comment "dpi-redirect"
    }

    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "wlp2s0" masquerade
    }
}
